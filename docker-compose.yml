# Local infrastructure for the fitness platform.
#
#   docker compose up -d kafka kafka-ui        -> just Kafka (+ web UI), run services with `npm run dev`
#   docker compose --profile apps up -d --build -> Kafka + gateway + all services in containers
#
# PostgreSQL is NOT started here: each service reads its own DATABASE_URL from its .env file.

name: fitness-platform

services:
  kafka:
    image: apache/kafka:4.1.2
    container_name: fitness-kafka
    ports:
      - '9092:9092' # for apps running on your host machine (localhost:9092)
    environment:
      # Single node acting as both broker and controller (KRaft mode, no ZooKeeper)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # INTERNAL -> used by containers on the compose network (kafka:19092)
      # EXTERNAL -> used by apps on your host machine (localhost:9092)
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # Single broker => replication factor must be 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Topics are created explicitly by the services (see packages/common/src/kafka/topics.js)
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          '/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1',
        ]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: fitness-kafka-ui
    ports:
      - '8080:8080' # browse topics, messages & consumer groups at http://localhost:8080
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
    depends_on:
      kafka:
        condition: service_healthy

  # ---------- Application containers (optional, enabled with --profile apps) ----------

  api-gateway:
    profiles: [apps]
    build: { context: ., dockerfile: api-gateway/Dockerfile }
    env_file: api-gateway/.env
    environment:
      MEMBER_SERVICE_URL: http://member-service:3001
      CLASS_SERVICE_URL: http://class-service:3002
      BOOKING_SERVICE_URL: http://booking-service:3003
    ports: ['3000:3000']
    depends_on: [member-service, class-service, booking-service]

  member-service:
    profiles: [apps]
    build: { context: ., dockerfile: services/member-service/Dockerfile }
    env_file: services/member-service/.env
    environment:
      KAFKA_BROKERS: kafka:19092
    ports: ['3001:3001']
    depends_on:
      kafka: { condition: service_healthy }

  class-service:
    profiles: [apps]
    build: { context: ., dockerfile: services/class-service/Dockerfile }
    env_file: services/class-service/.env
    environment:
      KAFKA_BROKERS: kafka:19092
    ports: ['3002:3002']
    depends_on:
      kafka: { condition: service_healthy }

  booking-service:
    profiles: [apps]
    build: { context: ., dockerfile: services/booking-service/Dockerfile }
    env_file: services/booking-service/.env
    environment:
      KAFKA_BROKERS: kafka:19092
    ports: ['3003:3003']
    depends_on:
      kafka: { condition: service_healthy }

volumes:
  kafka-data:
